# The platform carries no product, so its CI proves what it DOES own: the
# vendor generator, the witness, and that the stack it describes is valid.
#
# This cell is the odd one in the family: the orchestrator is Fabric's own
# built-in Airflow, so the platform bakes the product's dependencies into a
# sidecar image rather than the emulator installing them. That difference is
# the thing most likely to rot silently, which is why the tests run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--group dev`, not `--extra dev`: this repo declares its dev tools in
      # [dependency-groups], and `uv sync --extra dev` is a hard error against
      # that layout rather than a no-op.
      - run: uv sync --group dev
      - run: uv run pytest tests -q
      - run: uv run ruff check .

      - name: no test silently skipped
        run: |
          set -o pipefail
          uv run pytest tests -q 2>&1 | tee /tmp/out
          grep -qE "^[0-9]+ passed" /tmp/out
          if grep -qE "[0-9]+ skipped" /tmp/out; then
            echo "::error::a test skipped, CI must exercise the whole suite"
            exit 1
          fi

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: the vendor generator refuses what it should
        run: |
          python3 -m py_compile scripts/sources.py scripts/witness.py
          mkdir -p /tmp/src
          cat > /tmp/src/sources.yaml <<'YAML'
          version: 1
          vendors:
            - name: acme
              conn: acme
              kind: openapi
              spec: acme/openapi.yaml
              script: acme/serve.js
              data: _data/acme
              port: 8090
              formats: [csv]
          YAML
          sed -i 's/^          //' /tmp/src/sources.yaml
          printf 'MOKAPI_VERSION=0.50.0\n' > /tmp/src/versions.env
          python3 scripts/sources.py /tmp/src/sources.yaml /tmp/src > /tmp/frag.yml
          python3 -c "import json; d=json.load(open('/tmp/frag.yml')); assert d['services'], d; print('vendors:', list(d['services']))"
          # An unknown kind must be a hard error, not a quietly skipped vendor.
          printf 'version: 1\nvendors:\n  - name: nope\n    kind: telepathy\n' > /tmp/src/bad.yaml
          if python3 scripts/sources.py /tmp/src/bad.yaml /tmp/src > /dev/null 2>&1; then
            echo "::error::an unknown vendor kind was accepted"; exit 1
          fi

      - name: the compose stack is well-formed
        run: |
          mkdir -p /tmp/prod/dags
          printf '[project]\nname = "p"\nversion = "0"\n\n[build-system]\nrequires = ["hatchling"]\nbuild-backend = "hatchling.build"\n' > /tmp/prod/pyproject.toml
          set -a; . ./versions.env; set +a
          PRODUCT=/tmp/prod PRODUCT_NAME=prod SOURCES=/tmp/src \
            docker compose -f compose/docker-compose.yml -f /tmp/frag.yml config -q
          echo "compose config is valid"
