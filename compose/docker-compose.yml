# The built-in-Airflow stack: Fabric's control plane, and the Airflow it hosts.
#
# WHAT IS DELIBERATELY ABSENT compared with fabric-platform-airflow3: an Airflow
# of this platform's own. There, the platform runs the scheduler and mounts the
# product as a DAG bundle. Here the scheduler is FABRIC'S -- it ships inside the
# emulator behind `ApacheAirflowJob` items, the same way Sail is what a Fabric
# Spark pool actually is. A platform that started its own Airflow would be
# demonstrating the other cell.
#
# THE SIDECAR IS DECLARED HERE, pinned, exactly as the sibling platform declares
# Sail and the Spark agent. It is infrastructure this platform stands up, not
# something it can borrow: the emulator's own compose lives in the emulator's
# repository and a consumer cannot reach into it -- that would be the sibling
# path every platform here is forbidden to have.
#
# The VERSION is not a choice, though. Microsoft supports exactly Airflow 2.10.5
# on Python 3.12 for Apache Airflow jobs, and `AIRFLOW__CORE__EXECUTOR` is on
# the list of settings a Fabric user cannot override -- its value there is
# CeleryExecutor. So these are copied from what Fabric documents rather than
# picked, and `test_the_sidecar_matches_what_fabric_runs` holds them to it.
# Sequential would serialise every parallel DAG while still passing, which is
# the defect fabric-emulator#320 fixes on the emulator's own side.
services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:?see versions.env}
    environment:
      ORIGIN_MODE: compat
      TLS_ENABLED: "false"
      PORT: "8443"
      PUBLIC_ORIGIN: "http://entra-emulator:8443"
    ports:
      - "${ENTRA_PORT:-18443}:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 30

  fabric-emulator:
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:?see versions.env}
    depends_on:
      entra-emulator:
        condition: service_healthy
    environment:
      FABRIC_ADDR: ":9443"
      FABRIC_ENTRA_ISSUER: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/v2.0"
      # The emulator writes its self-signed cert here, on a volume, so every
      # client in the stack can trust the SAME file rather than each disabling
      # verification.
      FABRIC_DATA_DIR: "/data"
      # THE THREE THAT MAKE ApacheAirflowJob REAL. Without FABRIC_AIRFLOW_URL
      # the Airflow routes answer `AirflowNotConfigured`, which is an honest
      # "not wired up" rather than a hang -- and pointing it at a container
      # nobody started is the bug the emulator's own comments warn about, which
      # is why the sidecar profile and this URL travel together.
      FABRIC_AIRFLOW_URL: "http://airflow:8080"
      FABRIC_AIRFLOW_DAG_DIR: "/airflow-dags"
      FABRIC_AIRFLOW_USERNAME: admin
      FABRIC_AIRFLOW_PASSWORD: admin
      # Where Livy sessions execute. Fabric terminates Livy and the engine does
      # the compute; without this the Spark routes are an honest 501.
      FABRIC_SPARK_AGENT_URL: "http://spark-agent:8099"
    ports:
      - "${FABRIC_PORT:-19443}:9443"
    networks:
      default:
        # THE NAMES FABRIC ACTUALLY HAS. DNS inside the compose network points
        # them here, so the product addresses Fabric by its real hostnames and
        # nothing in the DAG knows it is talking to an emulator -- and the
        # emulator's certificate, which is issued for these names, matches.
        #
        # Addressing the container directly (`fabric-emulator:9443`) fails in a
        # way that names none of this: delta-rs reports "Generic MicrosoftAzure
        # error" against the abfss URI, because the cert does not cover the
        # container name.
        aliases:
          - api.fabric.microsoft.com
          - onelake.dfs.fabric.microsoft.com
    volumes:
      # SHARED WITH THE SIDECAR. The emulator writes DAG sources here and the
      # scheduler reads them from the same place, so the sync is a file copy
      # rather than an upload API -- which is also how Fabric describes it.
      - airflow-dags:/airflow-dags
      - emu-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/fabric-emulator", "healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 30

  # Fabric's built-in Airflow. Real upstream Airflow, because that is what
  # Fabric's Apache Airflow job IS -- not an imitation of one.
  airflow:
    # BUILT, not pulled: the product's dependencies have to be in the image
    # because the emulator has no requirements mechanism (real Fabric does).
    # The base tag is still the pin -- Fabric supports exactly this version.
    build:
      context: ${PRODUCT:?set PRODUCT=/path/to/a/product}/..
      dockerfile: ${PWD}/Dockerfile.airflow
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION:?see versions.env}
        PRODUCT_DIR: ${PRODUCT_NAME:?set by the Makefile}
    image: contoso-fabric-builtin-airflow:${AIRFLOW_VERSION:?see versions.env}
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-broker:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Fabric's default, and the emulator's client unpauses before every
      # trigger anyway.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://airflow-broker:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db/airflow
      # The emulator writes a DAG and waits for the scheduler to notice it; the
      # 5-minute defaults make that look like a hang.
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "2"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "1"
      # WHAT THE PRODUCT'S DAG READS. The platform supplies the vendor's
      # address and credential; the DAG names neither. In production these are
      # the real vendor's hostname and a secret from a vault, which is the only
      # thing that changes.
      CONTOSO_POS_API: "http://contoso-pos:8090"
      CONTOSO_POS_API_KEY: "${CONTOSO_POS_API_KEY:?the vendor's key -- make reads it from the sources fixture}"
      # HOW THE PRODUCT REACHES FABRIC from inside Fabric's own scheduler.
      # Supplied by the platform because they are deployment facts: in
      # production these are a real tenant, a real service principal and real
      # OneLake. The DAG reads them and branches on none of them.
      SSL_CERT_FILE: "/tmp/ca-bundle.pem"
      REQUESTS_CA_BUNDLE: "/tmp/ca-bundle.pem"
      FABRIC_API_ROOT: "https://api.fabric.microsoft.com:9443"
      FABRIC_ONELAKE_HOST: "onelake.dfs.fabric.microsoft.com"
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      # WHAT DELTA-RS NEEDS TO REACH THIS ONELAKE, as data rather than as a
      # branch in the product. The sibling leaf removed its last `if emulator:`
      # exactly here: a deployment difference expressed as a branch is one the
      # product must be edited to change.
      FABRIC_STORAGE_OPTIONS: >-
        {"azure_endpoint": "https://api.fabric.microsoft.com:9443/onelake",
         "azure_allow_invalid_certificates": "true"}
    volumes:
      - airflow-dags:/opt/airflow/dags
      - emu-data:/emu-data:ro
    ports:
      - "${AIRFLOW_UI_PORT:-18085}:8080"
    command:
      - bash
      - -ec
      - |
        # THE EMULATOR HAS TO BE ABLE TO WRITE HERE. It runs distroless as uid
        # 65532; this volume comes up owned by airflow:root at 0775, so 65532
        # matches neither owner nor group and gets r-x. SyncDAGs then fails
        # with permission denied at RUN time -- and the emulator reports that
        # as the generic `AirflowRunFailed`, so the symptom is a job that
        # failed with no reason and an empty dags folder.
        #
        # The airflow user owns the directory, so it can widen it. Doing it
        # here rather than in a separate init container keeps the stack to the
        # services that mean something.
        chmod 0777 /opt/airflow/dags
        # TRUST THE EMULATOR'S CERT, added to what is already trusted rather
        # than substituted for it. dbt-fabricspark opens the Livy session with
        # its own `requests` client, which verifies -- and unlike this DAG's
        # own calls there is no `verify=False` seam to reach. Without this the
        # failure is `Max retries exceeded` against api.fabric.microsoft.com,
        # which names neither TLS nor the certificate.
        #
        # APPENDED, because replacing the store breaks everything else: dbt
        # reaching hub.getdbt.com then fails with CERTIFICATE_VERIFY_FAILED.
        if [ -f /emu-data/tls/cert.pem ]; then
          python3 - <<'CAEOF'
        import pathlib, ssl
        out = pathlib.Path("/tmp/ca-bundle.pem")
        emulator = pathlib.Path("/emu-data/tls/cert.pem").read_text()
        try:
            import certifi
            system = pathlib.Path(certifi.where()).read_text()
        except Exception:
            default = ssl.get_default_verify_paths().cafile
            system = pathlib.Path(default).read_text() if default else ""
        out.write_text(system + "\n" + emulator)
        print("trust bundle: system CAs + emulator cert ->", out)
        CAEOF
        fi
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Fabric --lastname Emulator --role Admin --email admin@example.com
        airflow scheduler &
        # --hostname EXPLICITLY. Without it this combination of celery 5.4
        # and apache-airflow-providers-celery resolves the worker's node name
        # to None and the worker dies at startup with
        # `AttributeError: 'NoneType' object has no attribute 'split'` -- while
        # the scheduler keeps running, so the symptom is tasks that sit in
        # `queued` forever rather than an error anyone sees. Measured after the
        # image gained the product's dependencies; the stock image happened to
        # get a usable default.
        airflow celery worker --celery-hostname "worker@%h" &
        exec airflow webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  # A parallel executor needs concurrent writers; SQLite answers
  # `database is locked`, so the database is not a separable choice.
  airflow-db:
    image: postgres:${POSTGRES_VERSION:?see versions.env}
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The queue between scheduler and worker: the part that makes the executor
  # Celery rather than Local.
  airflow-broker:
    image: redis:${REDIS_VERSION:?see versions.env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- The engine ----------------------------------------------------------
  # Sail is what a Fabric Spark pool IS here: the emulator terminates Livy and
  # this computes. Silver's dbt-fabricspark models are submitted over that
  # Livy surface, so without an engine there is no silver -- only bronze.
  #
  # PINNED BY DIGEST as well as tag, matching the sibling platform. A tag can
  # be moved; a digest is the image that was actually verified.
  sail:
    image: ghcr.io/calvinchengx/emulator-sail:${SAIL_ENGINE_VERSION:?see versions.env}@${SAIL_ENGINE_DIGEST:?see versions.env}
    depends_on:
      fabric-emulator: {condition: service_healthy}
    environment:
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ACCOUNT_NAME: "onelake"
      AZURE_STORAGE_ENDPOINT: "https://api.fabric.microsoft.com:9443/onelake"
      # The emulator's cert is self-signed and object_store has no CA bundle
      # option; this is the documented seam for it.
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"
      SAIL_SPARK__SESSION_TIMEOUT_SECS: "3600"

  spark-agent:
    image: ghcr.io/calvinchengx/emulator-spark-agent:${SPARK_CLIENT_VERSION:?see versions.env}@${SPARK_CLIENT_DIGEST:?see versions.env}
    depends_on:
      sail: {condition: service_started}
    environment:
      SPARK_REMOTE: "sc://sail:50051"
      ENTRA_TOKEN_URL: "http://entra-emulator:8443/6f89cf12-978b-4d23-ac18-9ef0c127cf87/oauth2/v2.0/token"
      ENTRA_CLIENT_ID: "00d88624-f0d7-46f6-a641-6232c2608928"
      ENTRA_CLIENT_SECRET: "daemon-app-secret"
      AZURE_STORAGE_ENDPOINT: "https://api.fabric.microsoft.com:9443/onelake"
      AZURE_ALLOW_INVALID_CERTIFICATES: "true"

  # ---- The vendor -----------------------------------------------------------
  # Contoso POS, from `contoso-sources` -- the same declaration and the same
  # fixture bytes every other cell pulls from, which is the only reason gold
  # numbers can be compared across the family at all. This platform mounts what
  # that repository materialises; it does not carry a copy.
  #
  # ONE VENDOR, because this cell is proving an ORCHESTRATOR, not an ingest.
  # The Airflow 3 cell already witnesses all four. When this DAG widens to the
  # medallion the other three come with it, generated from sources.yaml rather
  # than hand-written here.
  contoso-pos:
    image: mokapi/mokapi:${MOKAPI_VERSION:?see versions.env}
    command:
      # The dashboard keeps every request AND its response body in memory; for
      # a 95 MB export that is a multi-hundred-MB copy per call.
      - --event-store-default-size=1
      - /sources/contoso-pos/openapi.yaml
      - /sources/contoso-pos/serve.js
    environment:
      # Go does not read the cgroup limit, so without this the heap climbs past
      # mem_limit and the container is killed mid-response.
      GOMEMLIMIT: 2GiB
    mem_limit: 4g
    volumes:
      - ${SOURCES:?set SOURCES=/path/to/contoso-sources}:/sources:ro
    expose:
      - "8090"

volumes:
  airflow-dags:
  # The emulator's data directory, shared read-only with the sidecar so every
  # client trusts the same certificate file.
  emu-data:
