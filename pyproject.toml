[project]
name = "fabric-platform-airflow-builtin"
version = "0.1.0"
description = "Contoso platform: fabric-emulator's built-in Apache Airflow (ApacheAirflowJob) as the orchestrator"
requires-python = ">=3.12"
authors = [{name = "Calvin Cheng", email = "calvin@calvinx.com"}]
# THE PLATFORM CARRIES NO PRODUCT. It installs one, and the product it runs is
# named by PRODUCT= on the command line, exactly as fabric-platform-airflow3
# does. Nothing here imports contoso_product.
dependencies = [
    "requests>=2.32,<3",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.16"]

[tool.ruff]
line-length = 100
target-version = "py312"
